; ZugFern – siehe README.md
;
;   esp32dev : Fernsteuerung (4 Potis, mehrere Hubs, Web-GUI), per USB
;   ota      : dieselbe Firmware über WLAN (StudRailMasterQuadro.local, Passwort aus src/secrets.h)
;   native   : Unit-Tests auf dem PC (pio test -e native)

[platformio]
extra_configs = src/probe/probe.ini  ; nur vorhanden, wenn es den Ordner gibt

[esp32_base]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
  h2zero/NimBLE-Arduino@^2.5.1
build_flags =
  -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=4

[env:esp32dev]
extends = esp32_base
board_build.partitions = min_spiffs.csv  ; 2 × 1,9 MB App für OTA
lib_deps =
  ${esp32_base.lib_deps}
  bblanchon/ArduinoJson@^7
build_src_filter = +<*> -<probe/>
extra_scripts = pre:tools/gen_web.py  ; src/web/index.html → src/web_index.h (gzip)

[env:ota]
extends = env:esp32dev
upload_protocol = espota
upload_port = StudRailMasterQuadro.local  ; anderer Gerätename: --upload-port Name.local
extra_scripts =
  ${env:esp32dev.extra_scripts}
  pre:tools/ota_auth.py

[env:native]
platform = native
test_framework = unity
build_src_filter = -<*>
extra_scripts = pre:tools/gen_vectors.py  ; drivers/*.json → test/test_drivers/vectors.h
