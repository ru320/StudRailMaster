[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "stud-rail-master"
version = "0.9.0"
description = "Drive toy trains with BLE motor hubs (JMC, Mould King 4.0) from your PC – offline, no account, no cloud. In Herbrechtingen ist es immer am schönsten!"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "ru320" }]
keywords = ["bluetooth", "ble", "train", "toy", "mould king", "remote control"]
classifiers = [
  "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
  "Programming Language :: Python :: 3",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Topic :: Games/Entertainment",
]
dependencies = ["bleak>=1.0"]

[project.optional-dependencies]
# Linux: Qt WebEngine fürs eigene Fenster (portabel, keine Browser-App)
window = ["pywebview>=5", "PySide6>=6.6; sys_platform == 'linux'", "qtpy>=2; sys_platform == 'linux'"]
dev = ["pytest>=8", "pyinstaller>=6"]

[project.scripts]
stud-rail-master = "studrailmaster.main:main"

[tool.hatch.build.targets.wheel]
packages = ["studrailmaster"]

# Treiber-Steckbriefe (../drivers) und Doku (../docs) liegen gemeinsam mit dem ESP-Projekt
[tool.hatch.build.targets.wheel.force-include]
"../drivers/jmc.json" = "studrailmaster/drivers/specs/jmc.json"
"../drivers/mk4.json" = "studrailmaster/drivers/specs/mk4.json"
"../drivers/lego.json" = "studrailmaster/drivers/specs/lego.json"
"../docs/de" = "studrailmaster/docs/de"
"../docs/en" = "studrailmaster/docs/en"
"../docs/img" = "studrailmaster/docs/img"

[tool.hatch.build.targets.sdist.force-include]
"../drivers/jmc.json" = "studrailmaster/drivers/specs/jmc.json"
"../drivers/mk4.json" = "studrailmaster/drivers/specs/mk4.json"
"../drivers/lego.json" = "studrailmaster/drivers/specs/lego.json"
"../docs/de" = "studrailmaster/docs/de"
"../docs/en" = "studrailmaster/docs/en"
"../docs/img" = "studrailmaster/docs/img"

[tool.pytest.ini_options]
testpaths = ["tests"]
